name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  images:
    name: Release images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [shim, agent, gateway, operator]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/pelican-k8s/${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: build/${{ matrix.component }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}

  charts:
    name: Release Helm charts
    runs-on: ubuntu-latest
    needs: [images]
    permissions:
      contents: write   # draft the GitHub release
      packages: write   # push the charts as OCI artifacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Package and push charts to ghcr.io (OCI)
        env:
          VERSION: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          v="${VERSION#v}"
          owner="${OWNER,,}"   # OCI repository names must be lowercase
          helm package charts/pelican-k8s --version "$v" --app-version "$v" -d dist
          helm package charts/pelican-panel -d dist
          for f in dist/*.tgz; do helm push "$f" "oci://ghcr.io/$owner/pelican-k8s/charts"; done
      - name: Release notes from CHANGELOG
        env:
          VERSION: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          v="${VERSION#v}"
          owner="${OWNER,,}"
          awk -v v="$v" '$0 ~ "^## \\["v"\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          {
            echo
            echo "## Artifacts"
            echo
            echo "Images (linux/amd64, linux/arm64): \`ghcr.io/$owner/pelican-k8s/{shim,agent,gateway,operator}:$v\`"
            echo
            echo "Charts: \`helm install pelican-k8s oci://ghcr.io/$owner/pelican-k8s/charts/pelican-k8s --version $v\`"
          } >> notes.md
      - name: GitHub release (draft)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          body_path: notes.md
          generate_release_notes: true
          files: dist/*.tgz
