# Early warning for Pelican upstream drift: builds and tests against the
# latest Wings main branch (not the pinned version) once a day.
name: Upstream drift

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  wings-main:
    name: Against Wings main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Point the replace at upstream main plus the hook branch check
        run: |
          # The hooks (ARCHITECTURE.md 6.3) live on the fork branch; upstream
          # main is used to detect route/remote/interface changes early.
          go mod edit -replace github.com/pelican/wings=github.com/pelican/wings@main
          go mod tidy || true
      - name: Route table, remote client and ProcessEnvironment diffs
        run: go test -count=1 -run 'TestGatewayCoversWingsRoutes|TestGatewayServesWingsRemoteCalls|TestProcessEnvironmentInterface' ./test/upstream/
      - name: Build (fails when the hooks are missing upstream, which is expected until they merge)
        continue-on-error: true
        run: go build ./...

  panel-image:
    name: Against the latest Panel image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diff the Panel's daemon repositories against the contract doc
        run: |
          docker pull ghcr.io/pelican/panel:latest
          docker run --rm ghcr.io/pelican/panel:latest sh -c 'cat app/Repositories/Daemon/DaemonRepository.php app/Providers/AppServiceProvider.php routes/api-remote.php' > panel-contract.txt
          grep -q 'Pelican Wings' panel-contract.txt
          grep -q "servers/{uuid}/container/status" panel-contract.txt
          grep -q "sftp/auth" panel-contract.txt
      - name: Compare the Panel chart appVersion with the latest Panel release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/pelican/panel/releases/latest --jq .tag_name)
          current=$(grep '^appVersion:' charts/pelican-panel/Chart.yaml | tr -d '" ' | cut -d: -f2)
          echo "chart appVersion=$current latest Panel release=$latest" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$latest" = "$current" ] || { echo "::warning::pelican-panel chart appVersion $current is behind Panel $latest"; echo "PANEL_BEHIND=$latest" >> "$GITHUB_ENV"; }
      - name: Open or update the tracking issue
        if: env.PANEL_BEHIND != ''
        uses: actions/github-script@v9
        with:
          script: |
            const title = `Pelican Panel ${process.env.PANEL_BEHIND} released: bump charts/pelican-panel appVersion and re-verify the contract`;
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state: 'open', labels: 'upstream'});
            if (issues.some(i => i.title === title)) return;
            await github.rest.issues.create({...context.repo, title, labels: ['upstream'],
              body: 'Detected by the nightly upstream-drift workflow. Re-verify docs/wings-panel-contract.md against the new Panel version, bump `appVersion` in charts/pelican-panel/Chart.yaml and run the e2e suite.'});

  notify:
    name: Report drift
    runs-on: ubuntu-latest
    needs: [wings-main, panel-image]
    if: failure()
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const title = 'Upstream drift: Wings main or the Panel image no longer match the gateway/agent';
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state: 'open', labels: 'upstream'});
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({...context.repo, issue_number: existing.number, body: `Still failing: ${url}`});
            } else {
              await github.rest.issues.create({...context.repo, title, labels: ['upstream'],
                body: `The nightly workflow failed: ${url}\n\nCheck test/upstream (route table, remote client, ProcessEnvironment) and docs/wings-panel-contract.md, then rebase the Wings hooks branch and bump the replace in go.mod.`});
            }
