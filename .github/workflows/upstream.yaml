# Early warning for Pelican upstream drift: builds and tests against upstream
# Wings main (not the pinned commit) and the latest Panel image once a day, and
# opens an issue when a Wings or Panel release is newer than the pinned Wings or
# the Panel chart's appVersion.
name: Upstream drift

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wings-main:
    name: Against Wings main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Require the tip of Wings main
        run: |
          go get github.com/pelican/wings@main
          go mod tidy
      - name: Report a pin that is behind main
        run: |
          if git diff --quiet go.mod go.sum; then
            echo "go.mod is pinned at the tip of Wings main" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            tip=$(go list -m -f '{{.Version}}' github.com/pelican/wings)
            echo "Wings main: \`$tip\` (go.mod is behind)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Route table, remote client and ProcessEnvironment diffs
        run: go test -count=1 -run 'TestGatewayCoversWingsRoutes|TestGatewayServesWingsRemoteCalls|TestProcessEnvironmentInterface' ./test/upstream/
      - name: Build and test against Wings main
        run: |
          go build ./...
          go test -count=1 ./...

  wings-release:
    name: Against the latest Wings release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that the pinned Wings contains the latest Wings release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # go.mod requires a tag or a pseudo-version whose last field is a
          # commit on Wings main. The release is in the pin when its tag is an
          # ancestor of that commit.
          latest=$(gh api repos/pelican/wings/releases/latest --jq .tag_name)
          pin=$(awk '$1 == "github.com/pelican/wings" {print $2}' go.mod)
          ref=$pin
          if [[ "$pin" =~ [.-][0-9]{14}-([0-9a-f]{12})$ ]]; then ref=${BASH_REMATCH[1]}; fi
          commit=$(gh api "repos/pelican/wings/commits/$ref" --jq .sha)
          git init -q "$RUNNER_TEMP/wings"
          cd "$RUNNER_TEMP/wings"
          git fetch -q --filter=blob:none https://github.com/pelican/wings "$commit"
          git fetch -q --filter=blob:none https://github.com/pelican/wings "refs/tags/$latest:refs/tags/$latest"
          echo "pinned Wings $pin, latest Wings release=$latest" | tee -a "$GITHUB_STEP_SUMMARY"
          git merge-base --is-ancestor "refs/tags/$latest" "$commit" || { echo "::warning::the pinned Wings ($pin) does not contain Wings $latest"; echo "WINGS_BEHIND=$latest" >> "$GITHUB_ENV"; }
      - name: Open the tracking issue
        if: env.WINGS_BEHIND != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = `Pelican Wings ${process.env.WINGS_BEHIND} released: bump Wings in go.mod and re-verify the contract`;
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state: 'open', labels: 'upstream'});
            if (issues.some(i => i.title === title)) return;
            await github.rest.issues.create({...context.repo, title, labels: ['upstream'],
              body: 'Detected by the nightly upstream-drift workflow. Bump Wings in go.mod (`go get github.com/pelican/wings@<tag> && go mod tidy`), run `go test ./test/upstream/ ./...` and the spike, re-verify docs/wings-panel-contract.md against the new Wings version and run the e2e suite (docs/development.md).'});

  panel-image:
    name: Against the latest Panel image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Diff the Panel's daemon-facing source against the contract doc
        run: hack/check-panel-contract.sh
      - name: Compare the Panel chart appVersion with the latest Panel release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/pelican/panel/releases/latest --jq .tag_name)
          current=$(grep '^appVersion:' charts/pelican-panel/Chart.yaml | tr -d '" ' | cut -d: -f2)
          echo "chart appVersion=$current latest Panel release=$latest" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$latest" = "$current" ] || { echo "::warning::pelican-panel chart appVersion $current is behind Panel $latest"; echo "PANEL_BEHIND=$latest" >> "$GITHUB_ENV"; }
      - name: Open or update the tracking issue
        if: env.PANEL_BEHIND != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = `Pelican Panel ${process.env.PANEL_BEHIND} released: bump charts/pelican-panel appVersion and re-verify the contract`;
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state: 'open', labels: 'upstream'});
            if (issues.some(i => i.title === title)) return;
            await github.rest.issues.create({...context.repo, title, labels: ['upstream'],
              body: 'Detected by the nightly upstream-drift workflow. Re-verify docs/wings-panel-contract.md against the new Panel version, bump `appVersion` in charts/pelican-panel/Chart.yaml and run the e2e suite.'});

  notify:
    name: Report drift
    runs-on: ubuntu-latest
    needs: [wings-main, wings-release, panel-image]
    if: failure()
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'Upstream drift: Wings main or the Panel image no longer match the gateway/agent';
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state: 'open', labels: 'upstream'});
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({...context.repo, issue_number: existing.number, body: `Still failing: ${url}`});
            } else {
              await github.rest.issues.create({...context.repo, title, labels: ['upstream'],
                body: `The nightly workflow failed: ${url}\n\nWings side: test/upstream (route table, remote client, ProcessEnvironment) against Wings \`main\`; adapt the gateway or agent before the next Wings bump.\nPanel side: \`hack/check-panel-contract.sh\` (runnable locally, \`PANEL_IMAGE=\` to pick a version) against docs/wings-panel-contract.md.`});
            }
