# Early warning for Pelican upstream drift: builds and tests against the tip of
# the Wings fork's hooks branch (not the pinned commit) and the latest Panel
# image once a day, and opens an issue when a Wings or Panel release is newer
# than the pinned Wings or the Panel chart's appVersion.
name: Upstream drift

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wings-branch:
    name: Against the Wings hooks branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Point the replace at the tip of the hooks branch
        run: |
          # The agent compiles against the pelican-k8s-hooks branch of the
          # Claiyc/wings fork, which carries the five hooks (ARCHITECTURE.md
          # 6.3) on top of upstream, so this checks the tip of that branch.
          go mod edit -replace github.com/pelican/wings=github.com/Claiyc/wings@pelican-k8s-hooks
          go mod tidy
      - name: Report a pin that is behind the branch
        run: |
          if git diff --quiet go.mod go.sum; then
            echo "go.mod is pinned at the tip of pelican-k8s-hooks" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            tip=$(go list -m -f '{{with .Replace}}{{.Version}}{{end}}' github.com/pelican/wings)
            echo "::warning::the pinned Wings replace is behind pelican-k8s-hooks ($tip); bump it in go.mod"
            echo "Wings branch tip: \`$tip\` (go.mod is behind)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Route table, remote client and ProcessEnvironment diffs
        run: go test -count=1 -run 'TestGatewayCoversWingsRoutes|TestGatewayServesWingsRemoteCalls|TestProcessEnvironmentInterface' ./test/upstream/
      - name: Build and test against the branch tip
        run: |
          go build ./...
          go test -count=1 ./...

  wings-release:
    name: Against the latest Wings release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that the pinned Wings contains the latest Wings release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The replace pins a pseudo-version whose last field is the commit
          # on pelican-k8s-hooks. The release is in the pin when its tag is an
          # ancestor of that commit (the branch merges upstream tags).
          latest=$(gh api repos/pelican/wings/releases/latest --jq .tag_name)
          pin=$(awk '$1 == "replace" && $2 == "github.com/pelican/wings" {print $NF}' go.mod)
          # The pin is fetched by its full hash, so the check also works when the
          # branch no longer contains it.
          commit=$(gh api "repos/Claiyc/wings/commits/${pin##*-}" --jq .sha)
          git init -q "$RUNNER_TEMP/wings"
          cd "$RUNNER_TEMP/wings"
          git fetch -q --filter=blob:none https://github.com/Claiyc/wings "$commit"
          git fetch -q --filter=blob:none https://github.com/pelican/wings "refs/tags/$latest:refs/tags/$latest"
          echo "pinned Wings $pin, latest Wings release=$latest" | tee -a "$GITHUB_STEP_SUMMARY"
          git merge-base --is-ancestor "refs/tags/$latest" "$commit" || { echo "::warning::the pinned Wings ($pin) does not contain Wings $latest"; echo "WINGS_BEHIND=$latest" >> "$GITHUB_ENV"; }
      - name: Open the tracking issue
        if: env.WINGS_BEHIND != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = `Pelican Wings ${process.env.WINGS_BEHIND} released: merge it into pelican-k8s-hooks, bump the replace in go.mod and re-verify the contract`;
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state: 'open', labels: 'upstream'});
            if (issues.some(i => i.title === title)) return;
            await github.rest.issues.create({...context.repo, title, labels: ['upstream'],
              body: 'Detected by the nightly upstream-drift workflow. Merge the release tag into the `pelican-k8s-hooks` branch of Claiyc/wings, point the `replace` in go.mod at the new tip, run `go test ./test/upstream/ ./...` and the spike, re-verify docs/wings-panel-contract.md against the new Wings version and run the e2e suite (docs/development.md).'});

  panel-image:
    name: Against the latest Panel image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Diff the Panel's daemon-facing source against the contract doc
        run: hack/check-panel-contract.sh
      - name: Compare the Panel chart appVersion with the latest Panel release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/pelican/panel/releases/latest --jq .tag_name)
          current=$(grep '^appVersion:' charts/pelican-panel/Chart.yaml | tr -d '" ' | cut -d: -f2)
          echo "chart appVersion=$current latest Panel release=$latest" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$latest" = "$current" ] || { echo "::warning::pelican-panel chart appVersion $current is behind Panel $latest"; echo "PANEL_BEHIND=$latest" >> "$GITHUB_ENV"; }
      - name: Open or update the tracking issue
        if: env.PANEL_BEHIND != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = `Pelican Panel ${process.env.PANEL_BEHIND} released: bump charts/pelican-panel appVersion and re-verify the contract`;
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state: 'open', labels: 'upstream'});
            if (issues.some(i => i.title === title)) return;
            await github.rest.issues.create({...context.repo, title, labels: ['upstream'],
              body: 'Detected by the nightly upstream-drift workflow. Re-verify docs/wings-panel-contract.md against the new Panel version, bump `appVersion` in charts/pelican-panel/Chart.yaml and run the e2e suite.'});

  notify:
    name: Report drift
    runs-on: ubuntu-latest
    needs: [wings-branch, wings-release, panel-image]
    if: failure()
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'Upstream drift: the Wings hooks branch or the Panel image no longer match the gateway/agent';
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state: 'open', labels: 'upstream'});
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({...context.repo, issue_number: existing.number, body: `Still failing: ${url}`});
            } else {
              await github.rest.issues.create({...context.repo, title, labels: ['upstream'],
                body: `The nightly workflow failed: ${url}\n\nWings side: test/upstream (route table, remote client, ProcessEnvironment) against the tip of \`pelican-k8s-hooks\`; rebase that branch on the new upstream tag and bump the \`replace\` in go.mod.\nPanel side: \`hack/check-panel-contract.sh\` (runnable locally, \`PANEL_IMAGE=\` to pick a version) against docs/wings-panel-contract.md.`});
            }
