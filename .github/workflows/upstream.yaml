# Early warning for Pelican upstream drift: builds and tests against the tip of
# the Wings fork's hooks branch (not the pinned commit) and the latest Panel
# image once a day.
name: Upstream drift

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wings-branch:
    name: Against the Wings hooks branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Point the replace at the tip of the hooks branch
        run: |
          # The four hooks (ARCHITECTURE.md 6.3) live on pelican-k8s-hooks in the
          # Claiyc/wings fork, which is rebased onto upstream whenever Wings is
          # bumped (docs/development.md). That branch is what the agent compiles
          # against, so it is what this workflow checks. Upstream main is not
          # usable while the hooks are unmerged: package boot only exists on the
          # branch, so a replace pointing at main neither tidies nor builds.
          # Once the hooks land upstream, drop the fork and point this (and the
          # replace in go.mod) at github.com/pelican/wings@main.
          go mod edit -replace github.com/pelican/wings=github.com/Claiyc/wings@pelican-k8s-hooks
          go mod tidy
      - name: Report a pin that is behind the branch
        run: |
          if git diff --quiet go.mod go.sum; then
            echo "go.mod is pinned at the tip of pelican-k8s-hooks" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            tip=$(go list -m -f '{{with .Replace}}{{.Version}}{{end}}' github.com/pelican/wings)
            echo "::warning::the pinned Wings replace is behind pelican-k8s-hooks ($tip); bump it in go.mod"
            echo "Wings branch tip: \`$tip\` (go.mod is behind)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Route table, remote client and ProcessEnvironment diffs
        run: go test -count=1 -run 'TestGatewayCoversWingsRoutes|TestGatewayServesWingsRemoteCalls|TestProcessEnvironmentInterface' ./test/upstream/
      - name: Build and test against the branch tip
        run: |
          go build ./...
          go test -count=1 ./...

  panel-image:
    name: Against the latest Panel image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Diff the Panel's daemon-facing source against the contract doc
        run: hack/check-panel-contract.sh
      - name: Compare the Panel chart appVersion with the latest Panel release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/pelican/panel/releases/latest --jq .tag_name)
          current=$(grep '^appVersion:' charts/pelican-panel/Chart.yaml | tr -d '" ' | cut -d: -f2)
          echo "chart appVersion=$current latest Panel release=$latest" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$latest" = "$current" ] || { echo "::warning::pelican-panel chart appVersion $current is behind Panel $latest"; echo "PANEL_BEHIND=$latest" >> "$GITHUB_ENV"; }
      - name: Open or update the tracking issue
        if: env.PANEL_BEHIND != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = `Pelican Panel ${process.env.PANEL_BEHIND} released: bump charts/pelican-panel appVersion and re-verify the contract`;
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state: 'open', labels: 'upstream'});
            if (issues.some(i => i.title === title)) return;
            await github.rest.issues.create({...context.repo, title, labels: ['upstream'],
              body: 'Detected by the nightly upstream-drift workflow. Re-verify docs/wings-panel-contract.md against the new Panel version, bump `appVersion` in charts/pelican-panel/Chart.yaml and run the e2e suite.'});

  notify:
    name: Report drift
    runs-on: ubuntu-latest
    needs: [wings-branch, panel-image]
    if: failure()
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'Upstream drift: the Wings hooks branch or the Panel image no longer match the gateway/agent';
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state: 'open', labels: 'upstream'});
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({...context.repo, issue_number: existing.number, body: `Still failing: ${url}`});
            } else {
              await github.rest.issues.create({...context.repo, title, labels: ['upstream'],
                body: `The nightly workflow failed: ${url}\n\nWings side: test/upstream (route table, remote client, ProcessEnvironment) against the tip of \`pelican-k8s-hooks\`; rebase that branch on the new upstream tag and bump the \`replace\` in go.mod.\nPanel side: \`hack/check-panel-contract.sh\` (runnable locally, \`PANEL_IMAGE=\` to pick a version) against docs/wings-panel-contract.md.`});
            }
