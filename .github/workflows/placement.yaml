# Live placement suite: a kind cluster with three workers and storage that is
# not bound to a node runs pelican-k8s built from this commit against the fake
# Panel, and test/placement checks how the agent pod and the game pod are
# placed and moved (ARCHITECTURE.md 7.7), and that an open console survives
# an agent pod replacement (5.9).
name: Placement

on:
  push:
    branches: [master]
  # Every pull request runs the workflow, so the required check always
  # reports; the changes job decides whether the suite has anything to test.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Scheduled runs come only from the default branch's workflow files.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its running suite; see ci.yaml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Placement inputs changed
    if: github.event.pull_request.draft != true || github.head_ref != 'release/next' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.files.outputs.relevant }}
    steps:
      - name: Does the pull request touch what the suite builds and drives?
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Pushes, the schedule and manual runs always run the suite.
          if [ -z "$PR" ]; then echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          relevant=false
          # Everything the suite builds and drives: the four images (the
          # gateway serves the Panel API the suite uses, and writes the state
          # it checks), the chart, and the suite itself.
          while IFS= read -r f; do
            case "$f" in
              api/*|cmd/*|internal/*|build/*|go.mod|go.sum|charts/pelican-k8s/*|test/placement/*|test/fakepanel/*|\
              hack/e2e-placement.sh|hack/kind-placement.yaml|.github/workflows/placement.yaml) relevant=true ;;
              *) ;;
            esac
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          echo "relevant=$relevant" | tee -a "$GITHUB_OUTPUT"

  kind:
    name: Placement on kind
    needs: changes
    # Skipped when the pull request touches nothing the suite covers, which a
    # required check counts as passed.
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          install_only: true
      - name: Run the suite
        run: hack/e2e-placement.sh
