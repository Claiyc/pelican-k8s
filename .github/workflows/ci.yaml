name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify generated code is current
        run: |
          make generate
          git diff --exit-code -- api charts/pelican-k8s/crds || (echo "run 'make generate' and commit"; exit 1)
      - name: Build
        run: make build
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Upstream compatibility (pinned Wings)
        run: go test -count=1 ./test/upstream/
      - name: Known vulnerabilities in dependencies (govulncheck)
        # Fails on any reachable vulnerability that has a fixed version. Findings
        # without a fix (e.g. in docker/docker, linked through Wings but never
        # executed by the agent) are reported in the step summary only.
        run: |
          set +e
          go run golang.org/x/vuln/cmd/govulncheck@latest ./... > govulncheck.txt 2>&1
          set -e
          { echo '## govulncheck'; echo '```'; cat govulncheck.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if grep -E '^\s*Fixed in: ' govulncheck.txt | grep -v 'N/A'; then
            echo "::error::vulnerabilities with an available fix; update the dependency"; cat govulncheck.txt; exit 1
          fi
          cat govulncheck.txt | tail -5
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changed-code gate compares against the merge base.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          # Build the linter with the repository's Go toolchain (prebuilt
          # binaries lag behind new Go releases).
          install-mode: goinstall
          install-only: true
      # The whole tree on the linters it already passes, the changed code on
      # all of them (Makefile, LINT_GATE).
      - name: Lint
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          make lint LINT_BASE=origin/${{ github.base_ref || github.event.repository.default_branch }}
      # Every finding of every linter, existing code included, goes to code
      # scanning (SARIF) and to SonarQube (checkstyle, through the report
      # job); it never fails the job.
      - name: Full report
        if: always()
        run: golangci-lint run --issues-exit-code 0 --max-issues-per-linter 0 --max-same-issues 0 --output.sarif.path golangci-lint.sarif --output.checkstyle.path golangci-lint.xml ./...
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: golangci-lint.sarif
          category: golangci-lint
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lint-report
          path: golangci-lint.xml
          if-no-files-found: ignore

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # A short run per target on top of the seed corpora that the unit tests
      # already replay. These parse input the game container, the Panel or a
      # browser control, so a crash here is a bug worth failing the build for.
      - name: Fuzz the untrusted-input parsers
        run: |
          set -e
          for pkg in ./internal/shim/protocol ./internal/shim/ringbuf ./internal/gateway/jwtx; do
            for fn in $(go test -list 'Fuzz.*' "$pkg" | grep '^Fuzz'); do
              echo "::group::$pkg $fn"
              go test -run '^$' -fuzz "^$fn\$" -fuzztime 40s "$pkg"
              echo "::endgroup::"
            done
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore

  spike:
    name: Spike (agent + shim in Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The agent and the shim run the Paper egg in a yolk container against
      # the fake Panel (test/spike). The test skips without Docker, which
      # counts as a failure here.
      - name: Run the spike
        run: |
          set -o pipefail
          go test -tags spike -count=1 -v -timeout 25m -coverprofile=coverage-spike.out -coverpkg=./internal/... ./test/spike | tee spike.out
          ! grep -q -- '--- SKIP' spike.out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-spike
          path: coverage-spike.out

  # Publishes what the test jobs measured. It runs none of the repository's
  # code, so the Codecov identity token and the SonarQube token stay out of
  # the jobs that do.
  report:
    name: Coverage and quality reports
    runs-on: ubuntu-latest
    needs: [go, spike, lint]
    # The unit coverage is worth publishing when the spike or the lint failed.
    if: ${{ !cancelled() && needs.go.result == 'success' }}
    permissions:
      contents: read
      id-token: write # Codecov accepts the workflow's OIDC token; no stored secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SonarQube attributes issues and new code through the history.
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage*
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lint-report
          merge-multiple: true
      - name: Unit coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          flags: unit
          disable_search: true
          # A pull request from a fork gets no OIDC token; Codecov takes its
          # upload without one.
          use_oidc: ${{ github.event.pull_request.head.repo.fork != true }}
      - name: Spike coverage to Codecov
        if: hashFiles('coverage-spike.out') != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage-spike.out
          flags: spike
          disable_search: true
          use_oidc: ${{ github.event.pull_request.head.repo.fork != true }}
      # Forks and Dependabot run without repository secrets.
      - name: Is the SonarQube token available?
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: echo "enabled=$([ -n "$SONAR_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: SonarQube Cloud analysis
        if: steps.sonar.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  helm:
    name: Helm charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Lint pelican-k8s
        run: |
          helm lint charts/pelican-k8s --set gateway.panelURL=https://panel.example.com --set gateway.nodeTokenID=id --set gateway.nodeToken=token
          helm template t charts/pelican-k8s --kube-version 1.35.0 --set gateway.panelURL=https://panel.example.com --set gateway.nodeTokenID=id --set gateway.nodeToken=token > /dev/null
          helm template t charts/pelican-k8s --kube-version 1.35.0 --set gateway.panelURL=https://panel.example.com --set gateway.nodeTokenID=id --set gateway.nodeToken=token --set openshift.enabled=true --set gateway.route.enabled=true --set gateway.route.host=wings.example.com > /dev/null
      - name: Lint pelican-panel
        run: |
          helm lint charts/pelican-panel
          for f in charts/pelican-panel/ci/*.yaml; do helm lint charts/pelican-panel -f "$f"; helm template t charts/pelican-panel -f "$f" > /dev/null; done

  scan:
    name: Image vulnerability scan
    runs-on: ubuntu-latest
    needs: [go]
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        component: [shim, agent, gateway, operator]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/${{ matrix.component }}.Dockerfile
          load: true
          tags: scan/${{ matrix.component }}:ci
          cache-from: type=gha
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/${{ matrix.component }}:ci
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: trivy-${{ matrix.component }}.sarif
          category: trivy-${{ matrix.component }}

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: [go]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [shim, agent, gateway, operator]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/pelican-k8s/${{ matrix.component }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/${{ matrix.component }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
