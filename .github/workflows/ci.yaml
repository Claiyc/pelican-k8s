name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify generated code is current
        run: |
          make generate
          git diff --exit-code -- api charts/pelican-k8s/crds || (echo "run 'make generate' and commit"; exit 1)
      - name: Build
        run: make build
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Upstream compatibility (pinned Wings)
        run: go test -count=1 ./test/upstream/
      - name: Known vulnerabilities in dependencies (govulncheck)
        # Fails on any reachable vulnerability that has a fixed version. Findings
        # without a fix (e.g. in docker/docker, linked through Wings but never
        # executed by the agent) are reported in the step summary only.
        run: |
          set +e
          go run golang.org/x/vuln/cmd/govulncheck@latest ./... > govulncheck.txt 2>&1
          set -e
          { echo '## govulncheck'; echo '```'; cat govulncheck.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if grep -E '^\s*Fixed in: ' govulncheck.txt | grep -v 'N/A'; then
            echo "::error::vulnerabilities with an available fix; update the dependency"; cat govulncheck.txt; exit 1
          fi
          cat govulncheck.txt | tail -5
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          # Build the linter with the repository's Go toolchain (prebuilt
          # binaries lag behind new Go releases).
          install-mode: goinstall
          args: --timeout 10m

  helm:
    name: Helm charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint pelican-k8s
        run: |
          helm lint charts/pelican-k8s --set gateway.panelURL=https://panel.example.com --set gateway.nodeTokenID=id --set gateway.nodeToken=token
          helm template t charts/pelican-k8s --kube-version 1.35.0 --set gateway.panelURL=https://panel.example.com --set gateway.nodeTokenID=id --set gateway.nodeToken=token > /dev/null
          helm template t charts/pelican-k8s --kube-version 1.35.0 --set gateway.panelURL=https://panel.example.com --set gateway.nodeTokenID=id --set gateway.nodeToken=token --set openshift.enabled=true --set gateway.route.enabled=true --set gateway.route.host=wings.example.com > /dev/null
      - name: Lint pelican-panel
        run: |
          helm lint charts/pelican-panel
          for f in charts/pelican-panel/ci/*.yaml; do helm lint charts/pelican-panel -f "$f"; helm template t charts/pelican-panel -f "$f" > /dev/null; done

  scan:
    name: Image vulnerability scan
    runs-on: ubuntu-latest
    needs: [go]
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        component: [shim, agent, gateway, operator]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/${{ matrix.component }}.Dockerfile
          load: true
          tags: scan/${{ matrix.component }}:ci
          cache-from: type=gha
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan/${{ matrix.component }}:ci
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-${{ matrix.component }}.sarif
          category: trivy-${{ matrix.component }}

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: [go]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [shim, agent, gateway, operator]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pelican-k8s/${{ matrix.component }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/${{ matrix.component }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
