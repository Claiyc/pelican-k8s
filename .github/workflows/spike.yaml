# The agent and the shim run the Paper egg in a Docker yolk container against
# the fake Panel (test/spike): install, start, done detection, stats,
# websocket auth, commands, stop and crash restart. Runs on request: add the
# "spike" label to a pull request (remove and re-add it to run again), or
# start the workflow by hand for any branch.
name: Spike

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    name: Spike (agent + shim in Docker)
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'spike'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run the spike
        run: go test -tags spike -count=1 -v -timeout 25m ./test/spike
