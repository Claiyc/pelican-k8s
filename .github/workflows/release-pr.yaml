# Keeps one release PR open while anything was merged since the last release.
# On every push to master it runs hack/release-prep.sh on a fresh copy of
# master, which writes the CHANGELOG.md section from GitHub's generated release
# notes, and force-pushes the result to the release/next branch, so the PR
# always shows exactly what the next release would be. Merging it is the
# release: the Release workflow sees a chart version without a tag on master
# and tags, builds and publishes it.
#
# A "minor" or "major" label on a merged PR raises the version; labelling a PR
# after it was merged refreshes the release PR too.
name: Release PR

on:
  push:
    branches: [master, main]
  # Runs master's copy of this workflow and never checks out the PR's code.
  pull_request_target:
    types: [labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

# Label events the job ignores (any label but major/minor, such as this
# workflow adding "release" to its own PR) get a group of their own, so they
# cannot cancel a run that is updating the release PR.
concurrency:
  group: >-
    ${{ (github.event_name != 'pull_request_target' ||
         contains(fromJSON('["major", "minor"]'), github.event.label.name))
        && 'release-pr' || format('release-pr-ignored-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  release-pr:
    name: Open or update the release PR
    # Label changes matter only for the version labels on PRs already merged
    # into the default branch.
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.merged &&
       github.event.pull_request.base.ref == github.event.repository.default_branch &&
       contains(fromJSON('["major", "minor"]'), github.event.label.name))
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the release/next branch, generate the notes
      pull-requests: write  # open, edit or close the release PR, read PR labels
      issues: write         # create the labels
    env:
      BRANCH: release/next
      BASE: ${{ github.event.repository.default_branch }}
      # Pushes and PRs made with the default GITHUB_TOKEN start no workflows,
      # so the release PR gets no CI checks. A RELEASE_PR_TOKEN secret (a
      # fine-grained PAT or GitHub App token with contents and pull-requests
      # write on this repository) makes them run.
      GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
          fetch-depth: 0  # the last release's tag and everything merged since
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Labels
        run: |
          # .github/release.yml leaves PRs labelled "release" out of the notes.
          gh label create release --color 0e8a16 --description "Release PR, left out of the release notes" --force
          gh label create minor --color fbca04 --description "Merging this makes the next release a minor one" --force
          gh label create major --color d93f0b --description "Merging this makes the next release a major one" --force
      - name: Prepare the release
        id: prep
        run: |
          rc=0
          v=$(hack/release-prep.sh 2>"$RUNNER_TEMP/prep.log") || rc=$?
          cat "$RUNNER_TEMP/prep.log" >&2
          case $rc in
            0) echo "version=$v" >> "$GITHUB_OUTPUT" ;;
            3) echo "version=" >> "$GITHUB_OUTPUT" ;;  # nothing to release, or a release still running
            *) exit "$rc" ;;
          esac
      - name: Close a release PR left over from before the last release
        if: steps.prep.outputs.version == ''
        run: |
          for n in $(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number'); do
            gh pr close "$n" --delete-branch --comment "Nothing was merged since the last release, so there is nothing to release."
          done
      - name: Check the prepared tree
        if: steps.prep.outputs.version != ''
        run: go test ./test/docs/
      - name: Push the release branch and open or update the PR
        if: steps.prep.outputs.version != ''
        env:
          VERSION: ${{ steps.prep.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -qam "release: $VERSION"
          git push --force origin "$BRANCH"
          {
            echo "Merging this PR releases **v$VERSION**: the Release workflow tags the merge commit, pushes the images and charts, and publishes the GitHub release with the notes below."
            echo
            echo "**Why $VERSION:** $(sed -n 's/^bump: //p' "$RUNNER_TEMP/prep.log"). A \`minor\` or \`major\` label on a merged PR raises it; the PR updates when you add one."
            echo
            echo "This PR is generated by \`.github/workflows/release-pr.yaml\` and rewritten on every push to $BASE, so don't push to its branch. The notes are GitHub's generated release notes plus anything written under \`[Unreleased]\` on $BASE (see \`hack/release-prep.sh\`)."
            echo
            echo "---"
            awk -v v="$VERSION" '$0 ~ "^## \\["v"\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md
          } > "$RUNNER_TEMP/body.md"
          n=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh pr edit "$n" --title "release: $VERSION" --body-file "$RUNNER_TEMP/body.md" --add-label release
          else
            gh pr create --base "$BASE" --head "$BRANCH" --title "release: $VERSION" --body-file "$RUNNER_TEMP/body.md" --label release
          fi
