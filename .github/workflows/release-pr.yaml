# Keeps one release PR open while anything was merged since the last release.
# On every push to master it runs hack/release-prep.sh on a fresh copy of
# master, which writes the CHANGELOG.md section from GitHub's generated release
# notes, and force-pushes the result to the release/next branch, so the PR
# always shows exactly what the next release would be. Merging it is the
# release: the Release workflow sees a chart version without a tag on master
# and tags, builds and publishes it.
name: Release PR

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-pr
  cancel-in-progress: true

jobs:
  release-pr:
    name: Open or update the release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the release/next branch, generate the notes
      pull-requests: write  # open, edit or close the release PR
      issues: write         # create the "release" label
    env:
      BRANCH: release/next
      # Pushes and PRs made with the default GITHUB_TOKEN start no workflows,
      # so the release PR gets no CI checks. A RELEASE_PR_TOKEN secret (a
      # fine-grained PAT or GitHub App token with contents and pull-requests
      # write on this repository) makes them run.
      GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
          fetch-depth: 0  # the last release's tag and everything merged since
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare the release
        id: prep
        run: |
          rc=0
          v=$(hack/release-prep.sh) || rc=$?
          case $rc in
            0) echo "version=$v" >> "$GITHUB_OUTPUT" ;;
            3) echo "version=" >> "$GITHUB_OUTPUT" ;;  # nothing merged since the last release
            *) exit "$rc" ;;
          esac
      - name: Close a release PR left over from before the last release
        if: steps.prep.outputs.version == ''
        run: |
          for n in $(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number'); do
            gh pr close "$n" --delete-branch --comment "Nothing was merged since the last release, so there is nothing to release."
          done
      - name: Check the prepared tree
        if: steps.prep.outputs.version != ''
        run: go test ./test/docs/
      - name: Push the release branch and open or update the PR
        if: steps.prep.outputs.version != ''
        env:
          VERSION: ${{ steps.prep.outputs.version }}
          BASE: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -qam "release: $VERSION"
          git push --force origin "$BRANCH"
          {
            echo "Merging this PR releases **v$VERSION**: the Release workflow tags the merge commit, pushes the images and charts, and publishes the GitHub release with the notes below."
            echo
            echo "This PR is generated by \`.github/workflows/release-pr.yaml\` and rewritten on every push to $BASE, so don't push to its branch. The notes are GitHub's generated release notes plus anything written under \`[Unreleased]\` on $BASE, whose headings also pick the version (see \`hack/release-prep.sh\`)."
            echo
            echo "---"
            awk -v v="$VERSION" '$0 ~ "^## \\["v"\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md
          } > "$RUNNER_TEMP/body.md"
          # .github/release.yml leaves PRs with this label out of the notes.
          gh label create release --color 0e8a16 --description "Release PR, left out of the release notes" --force
          n=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh pr edit "$n" --title "release: $VERSION" --body-file "$RUNNER_TEMP/body.md" --add-label release
          else
            gh pr create --base "$BASE" --head "$BRANCH" --title "release: $VERSION" --body-file "$RUNNER_TEMP/body.md" --label release
          fi
