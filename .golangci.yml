version: "2"
run:
  timeout: 10m
  build-tags: [spike, e2e]
linters:
  default: standard
  # The Makefile's LINT_GATE names the linters the whole tree is held to; the
  # rest gate changed code (`make lint`) and report their findings on the
  # existing code to code scanning.
  enable:
    - misspell
    - unconvert
    - errorlint
    - bodyclose
    - contextcheck
    - dupl
    - gocognit
    - gocritic
    - gocyclo
    - gosec
    - nilerr
    - revive
  settings:
    errcheck:
      # Closing readers/sockets and best-effort writes to logs and ring buffers.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net.Conn).Close
        - (net.Listener).Close
        - (*net/http.Response).Body.Close
        - (*github.com/gorilla/websocket.Conn).Close
        - (golang.org/x/crypto/ssh.Channel).Close
        - (*golang.org/x/crypto/ssh.Client).Close
        - (*golang.org/x/crypto/ssh.ServerConn).Close
        - (golang.org/x/crypto/ssh.NewChannel).Reject
        - fmt.Fprintf
        - fmt.Fprintln
        - (*github.com/Claiyc/pelican-k8s/internal/shim/ringbuf.Buffer).Write
    gosec:
      # Unchecked errors are errcheck's, with the exclusions above.
      excludes: [G104]
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
  exclusions:
    generated: lax
    paths:
      - api/v1alpha1/zz_generated.deepcopy.go
    rules:
      - path: _test\.go
        linters: [errcheck]
      # Tests and the test harness read fixtures, run commands and walk through
      # long scenarios on purpose.
      - path: (_test\.go|^test/)
        linters: [gosec, gocognit, gocyclo, dupl]
      # Handlers and interface implementations take parameters they ignore.
      - linters: [revive]
        text: "^unused-parameter:"
      - linters: [staticcheck]
        text: "SA1019: .*(scheme.Builder|GetEventRecorderFor)"
