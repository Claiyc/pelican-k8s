<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">pelican-k8s architecture</title>
<desc id="desc">The Panel calls the gateway over the Wings API. The gateway writes spec and status to the GameServer custom resource and proxies console, files and SFTP to the agent pod. The operator watches the GameServer and reconciles the agent pod and the game pod. The agent drives the shim in the game pod over the shim protocol; the shim runs the egg entrypoint. Both pods share the server PVC.</desc>
