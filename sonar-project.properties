# SonarQube Cloud, analysed from CI (job "Coverage and quality reports");
# Automatic Analysis is off in the project so that coverage can be imported.
sonar.projectKey=Claiyc_pelican-k8s
sonar.organization=claiyc

sonar.sources=.
sonar.exclusions=**/*_test.go,test/**,**/zz_generated.*.go,charts/pelican-k8s/crds/**,bin/**

# Process wiring (main packages) is exercised by the end-to-end tests, not by
# unit tests.
sonar.coverage.exclusions=cmd/**

sonar.tests=.
sonar.test.inclusions=**/*_test.go,test/**

# The unit and the spike profiles; a missing one is skipped.
sonar.go.coverage.reportPaths=coverage.out,coverage-spike.out

# Every golangci-lint finding except gocognit (CI job "golangci-lint", checkstyle
# format; the report job drops gocognit before the scan, see ci.yaml), shown next
# to SonarQube's own issues.
sonar.go.golangci-lint.reportPaths=golangci-lint.xml
