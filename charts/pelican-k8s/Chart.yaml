apiVersion: v2
name: pelican-k8s
description: |
  Kubernetes-native backend for Pelican Panel: a gateway that presents itself
  to the Panel as a Wings node, an operator that reconciles GameServer
  resources into pods, volumes and services, and the per-pod agent (Wings as
  a library) with its process shim.
type: application
