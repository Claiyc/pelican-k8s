{{- $name := include "pelican-k8s.operatorName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pelican-k8s.labels" . | nindent 4 }}
    app.kubernetes.io/name: pelican-operator
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: pelican-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "pelican-k8s.labels" . | nindent 8 }}
        app.kubernetes.io/name: pelican-operator
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "pelican-k8s.scheduling" (dict "values" .Values.operator "name" "pelican-operator" "root" .) | nindent 6 }}
      containers:
        - name: operator
          image: {{ include "pelican-k8s.image" (dict "root" . "name" "operator") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect={{ .Values.operator.leaderElect }}
            - --concurrency={{ .Values.operator.concurrency }}
            - --metrics-bind-address=:8443
            - --health-probe-bind-address=:8081
            {{- if .Values.tls.enabled }}
            - --tls
            {{- if .Values.tls.certManager.enabled }}
            {{- $issuer := include "pelican-k8s.certManagerIssuer" . | fromYaml }}
            - --tls-cert-manager-issuer={{ $issuer.name }}
            - --tls-cert-manager-issuer-kind={{ $issuer.kind }}
            - --tls-cert-manager-issuer-group={{ $issuer.group }}
            - --tls-dir=/etc/pelican-tls
            {{- else }}
            - --tls-ca-secret={{ include "pelican-k8s.caSecretName" . }}
            - --tls-gateway-secret={{ include "pelican-k8s.gatewayTLSSecretName" . }}
            - --tls-gateway-names={{ include "pelican-k8s.gatewayTLSNames" . }}
            - --tls-ca-lifetime={{ .Values.tls.ca.lifetime }}
            - --tls-ca-rotation={{ .Values.tls.ca.rotation.enabled }}
            - --tls-ca-rotation-overlap={{ .Values.tls.ca.rotation.overlap }}
            {{- end }}
            {{- end }}
            {{- if eq .Values.operator.logLevel "debug" }}
            - --zap-log-level=debug
            {{- end }}
          env:
            - name: PELICAN_SERVERS_NAMESPACE
              value: {{ include "pelican-k8s.serversNamespace" . | quote }}
            - name: PELICAN_SYSTEM_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: PELICAN_DEFAULT_CLASS
              value: {{ .Values.defaultClass.name | quote }}
          ports:
            - {name: metrics, containerPort: 8443}
            - {name: health, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{- toYaml .Values.operator.resources | nindent 12 }}
          {{- if and .Values.tls.enabled .Values.tls.certManager.enabled }}
          volumeMounts:
            - name: tls
              mountPath: /etc/pelican-tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: {{ include "pelican-k8s.operatorTLSSecretName" . }}
          {{- end }}
{{ include "pelican-k8s.pdb" (dict "values" .Values.operator "name" "pelican-operator" "fullname" $name "root" .) }}
