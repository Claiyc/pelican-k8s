apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pelican-k8s.gatewayName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "pelican-k8s.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pelican-k8s.operatorName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "pelican-k8s.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pelican-game
  namespace: {{ include "pelican-k8s.serversNamespace" . }}
  labels: {{- include "pelican-k8s.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pelican-game-hostport
  namespace: {{ include "pelican-k8s.serversNamespace" . }}
  labels: {{- include "pelican-k8s.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pelican-installer
  namespace: {{ include "pelican-k8s.serversNamespace" . }}
  labels: {{- include "pelican-k8s.labels" . | nindent 4 }}
automountServiceAccountToken: false
