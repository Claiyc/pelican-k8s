{{- if .Values.agentPriorityClass.create }}
# Agent pods rank above game pods (ARCHITECTURE.md 7.7).
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.agentPriorityClass.name }}
  labels: {{- include "pelican-k8s.labels" . | nindent 4 }}
value: {{ .Values.agentPriorityClass.value }}
preemptionPolicy: PreemptLowerPriority
globalDefault: false
description: "pelican-k8s agent pods: above game pods, so an agent can follow its game pod to a full node."
{{- end }}
