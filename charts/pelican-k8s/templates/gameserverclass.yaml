{{- if .Values.defaultClass.create }}
{{ include "pelican-k8s.gameServerClass" (dict "root" . "name" .Values.defaultClass.name "spec" (deepCopy .Values.defaultClass.spec)) }}
{{- end }}
{{- /* Extra classes: the default class's spec with the entry merged over it (maps merge; lists and scalars replace). */}}
{{- range $name, $override := .Values.extraClasses }}
{{- if eq $name $.Values.defaultClass.name }}
{{- fail (printf "extraClasses.%s: this is defaultClass.name, the class of every GameServer that names none" $name) }}
{{- end }}
---
{{ include "pelican-k8s.gameServerClass" (dict "root" $ "name" $name "spec" (mergeOverwrite (deepCopy $.Values.defaultClass.spec) (deepCopy (default (dict) $override)))) }}
{{- end }}
