---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: gameservers.pelican-k8s.io
spec:
  group: pelican-k8s.io
  names:
    kind: GameServer
    listKind: GameServerList
    plural: gameservers
    shortNames:
    - gs
    singular: gameserver
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.process.state
      name: Process
      type: string
    - jsonPath: .spec.power.desired
      name: Desired
      type: string
    - jsonPath: .spec.className
      name: Class
      type: string
    - jsonPath: .metadata.annotations.pelican-k8s\.io/panel-name
      name: Name
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: 'GameServer is one Panel server: one pod, one PVC, one CR.'
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: GameServerSpec is the desired state of a GameServer.
            properties:
              className:
                default: default
                description: ClassName references the GameServerClass supplying cluster-side
                  policy.
                type: string
              install:
                description: InstallSpec describes the pending or last install request.
                properties:
                  entrypoint:
                    description: Entrypoint is the installer entrypoint (bash, ash,
                      ...).
                    type: string
                  generation:
                    description: Generation is bumped to run a new install Job.
                    format: int64
                    minimum: 0
                    type: integer
                  image:
                    description: Image is the installer container image from the egg.
                    type: string
                  reinstall:
                    description: |-
                      Reinstall marks the request as a reinstall (the server is stopped first and
                      the Panel is told the result was a reinstall).
                    type: boolean
                  scriptConfigMap:
                    description: ScriptConfigMap names the ConfigMap holding install.sh
                      for this generation.
                    type: string
                  startOnInstall:
                    description: |-
                      StartOnInstall requests a start once this generation has succeeded
                      (`start_on_completion` from the Panel's create call).
                    type: boolean
                type: object
              panel:
                description: |-
                  PanelSpec mirrors the server as the Panel describes it. It is written by the
                  gateway and must not be edited by hand.
                properties:
                  environmentSecretRef:
                    description: EnvironmentSecretRef names the Secret holding the
                      egg variables (`settings.environment`).
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  panelRevision:
                    description: PanelRevision is a hash of the settings and process
                      configuration last applied.
                    type: string
                  processConfiguration:
                    description: ProcessConfiguration is the raw `process_configuration`
                      object from the Panel.
                    x-kubernetes-preserve-unknown-fields: true
                  settings:
                    description: |-
                      Settings is the raw `settings` object from GET /api/remote/servers/{uuid}
                      minus `environment`. The agent consumes it unchanged as its Wings server
                      configuration; the operator reads only suspended, container.image, build.*
                      and allocations.*.
                    x-kubernetes-preserve-unknown-fields: true
                  uuid:
                    description: UUID is the Panel server UUID.
                    maxLength: 36
                    minLength: 36
                    type: string
                  uuidShort:
                    description: UUIDShort is the first eight characters of the UUID
                      (the SFTP username suffix).
                    type: string
                required:
                - environmentSecretRef
                - processConfiguration
                - settings
                - uuid
                - uuidShort
                type: object
              power:
                default:
                  desired: Stopped
                description: PowerSpec is the desired process state.
                properties:
                  desired:
                    default: Stopped
                    description: Desired is Running or Stopped.
                    enum:
                    - Running
                    - Stopped
                    type: string
                  generation:
                    description: |-
                      Generation is bumped together with Desired=Running to request a (re)start.
                      The operator acts once per generation.
                    format: int64
                    minimum: 0
                    type: integer
                  kill:
                    description: Kill requests SIGKILL instead of the graceful stop
                      procedure when Desired is Stopped.
                    type: boolean
                  restartRequest:
                    description: RestartRequest is bumped to force a pod recreate
                      at the next safe point.
                    format: int64
                    minimum: 0
                    type: integer
                type: object
            required:
            - panel
            type: object
          status:
            description: GameServerStatus is the observed state of a GameServer.
            properties:
              agent:
                description: AgentStatus tracks the agent the operator is driving.
                properties:
                  podUID:
                    description: PodUID is the pod whose agent the operator last drove.
                    type: string
                  relayedExit:
                    description: RelayedExit identifies the last game container termination
                      forwarded to the agent.
                    type: string
                  sftpHostKey:
                    description: SftpHostKey is the agent's SSH host key fingerprint
                      pinned by the gateway.
                    type: string
                  syncedEnvVersion:
                    description: SyncedEnvVersion is the resourceVersion of the env
                      Secret last synced into the agent.
                    type: string
                  syncedRevision:
                    description: SyncedRevision is the spec.panel.panelRevision last
                      synced into the agent.
                    type: string
                type: object
              backups:
                description: BackupsStatus tracks backups in flight.
                properties:
                  pending:
                    items:
                      description: PendingBackup is a backup the agent is allowed
                        to report on.
                      properties:
                        startedAt:
                          format: date-time
                          type: string
                        uuid:
                          type: string
                      required:
                      - startedAt
                      - uuid
                      type: object
                    type: array
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoints:
                items:
                  description: Endpoint is an externally reachable game port.
                  properties:
                    ip:
                      type: string
                    port:
                      format: int32
                      type: integer
                    protocols:
                      items:
                        type: string
                      type: array
                  required:
                  - ip
                  - port
                  type: object
                type: array
              install:
                description: InstallStatus tracks install generations.
                properties:
                  finishedAt:
                    format: date-time
                    type: string
                  jobName:
                    description: JobName is the install Job of the current generation,
                      if any.
                    type: string
                  observedGeneration:
                    format: int64
                    type: integer
                  preparedGeneration:
                    format: int64
                    type: integer
                  reportedGeneration:
                    description: ReportedGeneration is the generation whose result
                      the gateway reported to the Panel.
                    format: int64
                    type: integer
                  requestedAt:
                    format: date-time
                    type: string
                  requestedGeneration:
                    description: RequestedGeneration is the generation the operator
                      asked the agent to install.
                    format: int64
                    type: integer
                  result:
                    type: string
                type: object
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: Phase is a coarse summary of a GameServer for kubectl
                  output.
                type: string
              podImage:
                description: PodImage is the digest-pinned image of the current pod.
                type: string
              power:
                description: PowerStatus tracks the operator's power actions.
                properties:
                  lastAction:
                    description: PowerActionRecord is the last power action the operator
                      issued.
                    properties:
                      action:
                        type: string
                      at:
                        format: date-time
                        type: string
                      podUID:
                        type: string
                    required:
                    - action
                    - at
                    type: object
                  observedGeneration:
                    format: int64
                    type: integer
                  observedRestartRequest:
                    description: ObservedRestartRequest is the spec.power.restartRequest
                      last acted on.
                    format: int64
                    type: integer
                type: object
              process:
                description: ProcessStatus is what the agent reported about the process.
                properties:
                  lastExit:
                    description: ExitStatus is the last observed process exit.
                    properties:
                      at:
                        format: date-time
                        type: string
                      code:
                        format: int32
                        type: integer
                      oomKilled:
                        type: boolean
                    required:
                    - code
                    type: object
                  since:
                    format: date-time
                    type: string
                  state:
                    description: State is offline, starting, running or stopping.
                    type: string
                type: object
              snapshot:
                description: SnapshotStatus tracks scheduled VolumeSnapshots.
                properties:
                  lastAt:
                    format: date-time
                    type: string
                  lastName:
                    type: string
                type: object
              templateHash:
                description: TemplateHash is the pod template hash the current StatefulSet
                  carries.
                type: string
              usage:
                description: UsageStatus is a throttled resource usage summary.
                properties:
                  cpuPercent:
                    type: string
                  diskBytes:
                    format: int64
                    type: integer
                  memoryBytes:
                    format: int64
                    type: integer
                  updatedAt:
                    format: date-time
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
