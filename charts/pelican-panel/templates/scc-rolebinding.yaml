{{- if .Values.openshift.scc.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-scc-%s" (include "pelican-panel.fullname" .) .Values.openshift.scc.name | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pelican-panel.labels" . | nindent 4 }}
  {{- with (include "pelican-panel.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:{{ .Values.openshift.scc.name }}
subjects:
  {{- if .Values.openshift.scc.bindToNamespaceGroup }}
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: system:serviceaccounts:{{ .Release.Namespace }}
  {{- else }}
  - kind: ServiceAccount
    name: {{ include "pelican-panel.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
  {{- end }}
{{- end }}
